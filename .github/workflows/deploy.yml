name: 🚀 Deploy Novustream

on:
  push:
    branches:
      - testing

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔐 SSH into server and deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}   # likely "cdnstesting"
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            echo "→ Starting deployment on server..."

            cd /var/www/html/novustream-morong

            echo "→ Setting Git safe directory..."
            git config --global --add safe.directory /var/www/html/novustream-morong

            echo "→ Pulling latest code from testing..."
            git fetch origin testing
            git reset --hard origin/testing

            echo "→ Installing PHP dependencies..."
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

            echo "→ Installing Node dependencies..."
            npm ci --no-audit --no-fund || { echo "❌ npm install failed"; exit 1; }

            echo "→ Building frontend assets..."
            npm run build || { echo "❌ vite build failed"; exit 1; }

            echo "→ Optimizing Laravel..."
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan migrate --force

            echo "→ Fixing ownership and permissions..."
            sudo chown -R cdnstesting:www-data /var/www/html/novustream-morong
            sudo chown -R www-data:www-data storage bootstrap/cache
            sudo find storage bootstrap/cache -type d -exec chmod 775 {} \;
            sudo find storage bootstrap/cache -type f -exec chmod 664 {} \;

            echo "✅ Deployment completed successfully!"
